[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/config",
  "crates/llm",
  "crates/execpolicy",
  "crates/tools",
  "crates/context",
  "crates/retrieval",
  "crates/agent",
  "crates/subagent",
  "crates/pipeline",
  "crates/mcp",
  "crates/acp",
  "crates/tui",
  "crates/cli",
  "crates/eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["agent-tui contributors"]
repository = "https://github.com/ashtonantony28/deepseek-tui-enhanced"

[workspace.dependencies]
# Core async + utilities
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Serde stack
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors
thiserror = "1"
anyhow = "1"

# Paths
camino = { version = "1.1", features = ["serde1"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2.5"
bytes = "1.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# UUID + time
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Diff + similarity
similar = "2.6"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Tree-sitter (stable subset of languages for Phase 2 verification)
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-java = "0.21"

# Misc
once_cell = "1.19"
regex = "1.10"
walkdir = "2.5"
ignore = "0.4"
dirs = "5.0"

# Workspace-internal crates
agent-tui-protocol = { path = "crates/protocol" }
agent-tui-config = { path = "crates/config" }
agent-tui-llm = { path = "crates/llm" }
agent-tui-execpolicy = { path = "crates/execpolicy" }
agent-tui-tools = { path = "crates/tools" }
agent-tui-context = { path = "crates/context" }
agent-tui-retrieval = { path = "crates/retrieval" }
agent-tui-agent = { path = "crates/agent" }
agent-tui-subagent = { path = "crates/subagent" }
agent-tui-pipeline = { path = "crates/pipeline" }
agent-tui-mcp = { path = "crates/mcp" }
agent-tui-acp = { path = "crates/acp" }
agent-tui-tui = { path = "crates/tui" }
agent-tui-eval = { path = "crates/eval" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
